# Thousands Minigames
# Instance_Configs_Cloner 配置
# base_dir 的相对路径相对于脚本所在目录（_scripts）解析。
# 其余相对路径相对于 base_dir 解析。

# 基准目录。目录路径。
base_dir = "..\\"

# 模板配置根目录。目录路径。
template_root = "_scripts\\TM_Example_Configs\\configs\\"

# 实例配置根目录。目录路径。
configs_root = "configs\\"

# 世界根目录。目录路径。
worlds_root = "worlds\\"

# 版本映射文件。文件路径。
version_map = "_scripts\\_Configs\\Version_Map.toml"

# 备份根目录。目录路径。
backup_dir = "configs\\_backups\\"

# 目标实例名。留空表示未设置。
instance_name = ""

# 模板名。留空表示未设置。
template_name = ""

# 每个实例最大备份保留数量。0 表示不限制。
max_backups = 0

[interactive]
# 是否在交互模式开始时显示当前环境配置。
show_paths = true
