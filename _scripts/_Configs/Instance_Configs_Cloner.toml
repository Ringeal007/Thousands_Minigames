# Thousands Minigames
# Instance_Configs_Cloner 配置
# 相对路径相对于脚本所在目录解析。

# 模板配置根目录。目录路径。
template_root = ".\\TM_Example_Configs\\configs\\"

# 实例配置根目录。目录路径。
configs_root = "..\\configs\\"

# 世界根目录。目录路径。
worlds_root = "..\\worlds\\"

# 版本映射文件。文件路径。
version_map = ".\\_Configs\\Version_Map.toml"

# 目标实例名。留空表示未设置。
instance_name = ""

# 模板名。留空表示未设置。
template_name = ""

# 每个实例最大备份保留数量。0 表示不限制。
max_backups = 0

[interactive]
# 是否在交互模式开始时显示当前环境配置。
show_paths = true
